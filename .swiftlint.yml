custom_rules:
  forbidden-font-direct:
    name: "Forbidden direct font usage"
    regex: '\.font\(\.(system|custom)'
    message: |
      直値フォント指定は禁止！DesignTokens.Fonts.labelBold などSemantic名を使ってください。
      → See: /docs/lint_exceptions.md
      → Learn More: /docs/font_guidelines.md#why-forbidden
    severity: error
  forbidden-debug-modifiers:
    name: "Forbidden debug modifier usage"
    regex: '\\.debug(Screen|Section|Component|Form|Dynamic|Module)'
    message: |
      Debug modifiers have been removed. Use .accessibilityIdentifier("ViewName") directly.
    severity: error
  discouraged-font-usage:
    name: "Discouraged Font.system usage"
    regex: 'Font\.system'
    message: |
      Font.systemの直接使用は推奨しません。DesignTokens.Fonts.xxx を使ってください。
      → Learn More: /docs/font_guidelines.md#why-forbidden
    severity: warning
  short_identifier_name:
    included: ".*\\.swift"
    name: "Short Identifier Name Violation"
    regex: '\\b([a-zA-Z])\\b'
    excluded_regex: '\\b(i|j|k|x|y|t|p)\\b'
    message: "Single-letter variable names are not allowed except for i, j, k, x, y, t, p."
    severity: error
  labels_no_sentence:
    included: ".*Labels\\.swift$"
    name: "Labels: No sentence-like text"
    regex: "[\\?\\!…]|\\w+\\.$"
    message: "Labels には文体（?, !, …, 文末.）を入れないこと。Messagesへ。詳細は docs/_guide-copy-classification.md を必ず参照すること。"
    severity: error
  copy_no_paragraph:
    included: ".*Copy\\.swift$"
    name: "Copy: No long sentence"
    regex: 'static let \w+ = "[^"]{41,}"'
    message: "Copy に長文は不可。Messagesへ。詳細は docs/_guide-copy-classification.md を必ず参照すること。"
    severity: error
  forbid_direct_localized_string:
    included: ".*\\.swift$"
    excluded: ".*/(Labels|Copy|Messages)\\.swift$"
    name: "Forbid direct NSLocalizedString"
    regex: "NSLocalizedString\\s*\\("
    message: "新規コードでは3層分類システムを使用すること。Labels/Copy/Messages経由でアクセス。詳細は docs/_guide-copy-classification.md を必ず参照すること。"
    severity: error
  forbid_raw_pencil_image:
    included: ".swift"
    name: "No raw SF Pencil (Image)"
    regex: 'Image\(\s*systemName:\s*"pencil"\s*\)'
    message: "Use EditIconButton or PencilIcon with DesignTokens.IconColors.pencil"
    severity: error
  forbid_pencil_label_warning:
    included: ".swift"
    name: "Prefer EditIconLabel over raw Label pencil"
    regex: 'Label\s*\([^\)]*,\s*systemImage:\s*"pencil"\s*\)'
    message: "Use EditIconLabel for semantic unification"
    severity: warning

excluded:
  - tools/
  - ./tools/
  - tools/**
  - ./tools/**

disabled_rules:
  - identifier_name
